services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: API/FYMTechnology.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=database,1433;Database=FYMTechnology;User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY}
      Seed__SuperAdminUsername: ${SUPERADMIN_USERNAME}
      Seed__SuperAdminPassword: ${SUPERADMIN_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      database:
        condition: service_healthy
  front:
    build:
      context: .
      dockerfile: Front/Dockerfile
      args:
        VITE_API_URL: http://localhost:5080/api
    ports:
      - "5173:8080"
    depends_on:
      - api
volumes:
  sql-data:
